<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripes V1 - Clean Hub</title>
    <style>
        /* Cyberpunk dark background with blue accents */
        body {
            background-color: #060a12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }
        
        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Avatar Box matching Stripes V1 but with neon blue glow */
        .avatar-display-box {
            background-color: #0d1527;
            border: 2px solid #00d2ff;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-img {
            width: 160px;
            height: 160px;
            margin-bottom: 20px;
        }

        .avatar-title {
            color: #00d2ff;
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Blue Avatar Layout Block Only -->
        <div class="avatar-display-box">
            <img class="avatar-img" src="https://dicebear.com" alt="Avatar">
            <h1 class="avatar-title">SUPERDAYEEP HUB</h1>
        </div>

    </div>

</body>
</html>
