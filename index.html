<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripes V1 - Blue Hub</title>
    <style>
        /* Cyberpunk dark background with blue accents */
        body {
            background-color: #060a12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        
        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Avatar Box matching Stripes V1 but with neon blue glow */
        .avatar-display-box {
            background-color: #0d1527;
            border: 2px solid #00d2ff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-img {
            width: 130px;
            height: 130px;
            margin-bottom: 10px;
        }

        .avatar-title {
            color: #00d2ff;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
        }

        /* Blue Music Player Box */
        .music-box {
            background-color: #0d1527; 
            border: 1px solid #1a294a; 
            border-radius: 8px; 
            padding: 15px; 
            margin-bottom: 25px; 
            text-align: center; 
            width: 100%; 
            box-sizing: border-box;
        }

        .music-label {
            color: #00d2ff; 
            margin: 0 0 10px 0; 
            font-weight: bold; 
            font-size: 0.9rem;
        }

        .announcement {
            color: #00d2ff;
            text-align: center;
            font-weight: bold;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        /* Interactive Menu Selection Cards */
        .mod-card {
            background-color: #0d1527;
            border: 1px solid #1a294a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        /* Neon Blue Hover Highlight */
        .mod-card:hover {
            transform: translateY(-2px);
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.15);
        }

        .mod-title {
            color: #00d2ff;
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0 0 6px 0;
        }

        .mod-desc {
            color: #8fa0c2;
            font-size: 0.95rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Blue Avatar Layout Block -->
        <div class="avatar-display-box">
            <img class="avatar-img" src="https://dicebear.com" alt="Avatar">
            <h1 class="avatar-title">SUPERDAYEEP HUB</h1>
        </div>

        <!-- Background Music Container -->
        <div class="music-box">
            <p class="music-label">🎵 BACKGROUND MUSIC</p>
            <audio controls loop style="width: 100%; max-width: 300px;">
                <source src="https://soundhelix.com" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <div class="announcement">CLICK TO DOWNLOAD TRUCKS</div>

        <!-- Mod Cards -->
        <a href="#" class="mod-card">
            <h2 class="mod-title">SPM Gorilla Tag Mods</h2>
            <p class="mod-desc">Mod Menu No PC</p>
        </a>

        <a href="#" class="mod-card">
            <h2 class="mod-title">Fangame Modder</h2>
            <p class="mod-desc">ye, mods fangames</p>
        </a>

        <a href="#" class="mod-card">
            <h2 class="mod-title">Delta</h2>
            <p class="mod-desc">delta new adb</p>
        </a>

    </div>

</body>
</html>
