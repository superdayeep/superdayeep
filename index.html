<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superdayeep Hub</title>
    <style>
        body {
            background-color: #060a12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .avatar-display-box {
            background-color: #0d1527;
            border: 3px solid #00d2ff;
            border-radius: 50%;
            width: 260px;
            height: 260px;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .avatar-img {
            width: 165%;
            height: 165%;
            object-fit: cover;
            position: absolute;
            top: -30%; 
            left: -32.5%;
        }
        .hub-title {
            color: #00d2ff;
            font-size: 1.4rem;
            font-weight: bold;
            margin: 25px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
        }
        /* Navigation Button Styling */
        .nav-btn {
            background-color: #0d1527;
            border: 2px solid #00d2ff;
            border-radius: 8px;
            color: #00d2ff;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.1);
        }
        .nav-btn:hover {
            transform: translateY(-2px);
            background-color: #00d2ff;
            color: #060a12;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-display-box">
            <img class="avatar-img" src="avatar.png" alt="Avatar">
        </div>

        <h1 class="hub-title">SUPERDAYEEP HUB</h1>

        <!-- This button links to your new downloads page -->
        <a href="downloads.html" class="nav-btn">Enter Download Hub</a>
    </div>

</body>
</html>
