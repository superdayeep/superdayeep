<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripes V1 - Circle Hub</title>
    <style>
        /* Cyberpunk dark background with blue accents */
        body {
            background-color: #060a12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }
        
        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Fully circular Avatar Display Box with a neon blue glow */
        .avatar-display-box {
            background-color: #0d1527;
            border: 3px solid #00d2ff;
            border-radius: 50%; /* Makes the box a perfect circle */
            width: 260px;
            height: 260px;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Hides everything outside the circle */
            position: relative;
        }

        /* Zooms and crops your picture down to only show the monkey inside the ring */
        .avatar-img {
            width: 165%;
            height: 165%;
            object-fit: cover;
            position: absolute;
            top: -30%; 
            left: -32.5%;
        }

        /* Title styling positioned below the circle */
        .hub-title {
            color: #00d2ff;
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Circular Avatar Container -->
        <div class="avatar-display-box">
            <img class="avatar-img" src="avatar.png" alt="Gorilla Tag Monkey Profile Picture">
        </div>

        <!-- Title Display Text below the avatar circle -->
        <h1 class="hub-title">SUPERDAYEEP HUB</h1>

    </div>

</body>
</html>
