<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superdayeep Hub</title>
    <style>
        /* Cyberpunk dark background with blue accents */
        body {
            background-color: #060a12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }
        
        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Fully circular Avatar Display Box with a neon blue glow */
        .avatar-display-box {
            background-color: #0d1527;
            border: 3px solid #00d2ff;
            border-radius: 50%;
            width: 260px;
            height: 260px;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Zooms and crops your picture down to only show the monkey inside the ring */
        .avatar-img {
            width: 165%;
            height: 165%;
            object-fit: cover;
            position: absolute;
            top: -30%; 
            left: -32.5%;
        }

        /* Title styling positioned below the circle */
        .hub-title {
            color: #00d2ff;
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
            text-align: center;
        }

        /* Stripes V1 card-style button at the end of the page */
        .stripes-btn {
            background-color: #0d1527;
            border: 1px solid #1a294a;
            border-radius: 8px;
            padding: 20px;
            text-decoration: none;
            display: block;
            width: 100%;
            box-sizing: border-box;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            text-align: center;
        }

        /* Neon Blue Hover Highlight matching the original tool page */
        .stripes-btn:hover {
            transform: translateY(-2px);
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.15);
        }

        .btn-title {
            color: #00d2ff;
            font-size: 1.3rem;
            font-weight: bold;
            margin: 0 0 4px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Subtitle display styling underneath the button title */
        .btn-subtitle {
            color: #8fa0c2;
            font-size: 0.95rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Circular Avatar Container -->
        <div class="avatar-display-box">
            <img class="avatar-img" src="avatar.png" alt="Gorilla Tag Monkey Profile Picture">
        </div>

        <!-- Title Display Text -->
        <h1 class="hub-title">SUPERDAYEEP HUB</h1>

        <!-- Stripes-style Card Button positioned at the end of the layout -->
        <a href="downloads.html" class="stripes-btn">
            <h2 class="btn-title">Enter Download Hub</h2>
            <p class="btn-subtitle">Click here to browse available standalone mod menus</p>
        </a>

    </div>

</body>
</html>
